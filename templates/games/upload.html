{% extends "base.html" %}

{% block title %}Upload a game{% endblock %}

{% block content %}
<h1 class="h3 mb-3">Upload a game</h1>
<p class="text-body-secondary">
  Paste a game in PGN format. You can export PGN from Lichess, Chess.com or any chess program.
</p>

{% if error %}
  <div class="alert alert-danger">{{ error }}</div>
{% endif %}

<form method="post" class="form-stack">
  {% csrf_token %}
  <textarea name="pgn" rows="15" class="pgn-input mb-3"
            placeholder='[Event "Casual game"]&#10;&#10;1. e4 e5 2. Nf3 Nc6 ...'>{{ pgn }}</textarea>
  <button type="submit" class="btn btn-primary">Upload</button>
  <a href="{% url 'game_list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
