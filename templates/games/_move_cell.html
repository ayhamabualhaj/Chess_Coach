<td class="{% if cell.mistake %}cell-{{ cell.mistake.severity }}{% endif %}">  {% if cell %}
    <span class="fw-semibold">{{ cell.san }}</span>
    {% if cell.mistake %}
      <span class="badge {% if cell.mistake.severity == 'blunder' %}text-bg-danger{% elif cell.mistake.severity == 'mistake' %}text-bg-warning{% else %}text-bg-secondary{% endif %}">{{ cell.mistake.get_severity_display }}</span>
      <div class="small text-body-secondary">
        −{{ cell.cp_loss }} cp{% if cell.best_san %} · best was <strong>{{ cell.best_san }}</strong>{% endif %}
      </div>
    {% endif %}
  {% endif %}
</td>
