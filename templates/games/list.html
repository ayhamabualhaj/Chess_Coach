<p>
  Logged in as {{ user.username }}
  <form method="post" action="{% url 'logout' %}" style="display:inline">
    {% csrf_token %}
    <button type="submit">Log out</button>
  </form>
</p>
<h1>My games</h1>
<a href="{% url 'upload_game' %}">Upload a game</a>
<ul>
  {% for game in games %}
    <li>Game {{ game.pk }} — {{ game.created_at }}</li>
  {% empty %}
    <li>No games yet.</li>
  {% endfor %}
</ul>
